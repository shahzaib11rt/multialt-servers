name: Build installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install
      - run: bun run tauri build
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Installer | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1) Installer/MultiAlt-Servers-Setup.msi
      - uses: actions/upload-artifact@v4
        with:
          name: MultiAlt-Servers-Installer
          path: Installer
